# Served by client/Dockerfile.production. The backend hostname "backend"
# matches the service name in docker-compose.production.yml — override it
# there (or with a different compose/orchestrator) if the backend is
# reachable under a different name.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Tuned to what this app actually loads: Google Fonts' two hosts, and
    # same-origin for everything else (the API is same-origin here because
    # of the /api proxy below, exactly like the Vite dev-server proxy in
    # vite.config.ts). See server/src/config/security.ts for why the
    # backend's own CSP is maximally strict instead — it never serves HTML.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames (Vite's default output) are safe to cache forever.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — any non-file, non-/api path resolves to index.html so
    # client-side routing (React Router) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
