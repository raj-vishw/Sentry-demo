# Dev stack for sentry-demo — bind-mounted source, hardcoded dev-only
# placeholder secrets (never used for the production compose file). Ports
# are deliberately distinct from ctf-platform's own docker-compose.yml so
# both stacks can run simultaneously on the same machine without conflict.
#
# MongoDB is a dedicated external Atlas cluster, not a bundled local
# container — there is no `mongodb` service here. Set MONGODB_URI below
# (or override it in a sibling .env this compose file reads) to point at
# that cluster's own database, e.g.
#   mongodb+srv://<user>:<pass>@<cluster-host>/sentry-demo?appName=<app>
# Note the `/sentry-demo` path segment — without an explicit database
# name, the driver silently defaults to Atlas's own `test` database.
services:
  backend:
    build: ./server
    restart: unless-stopped
    ports:
      - '4001:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set — see this file's header comment}
      JWT_SECRET: dev-only-sentry-demo-access-secret-change-me
      JWT_REFRESH_SECRET: dev-only-sentry-demo-refresh-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5174
      ADMIN_ROUTE_PREFIX: demo-ops
      DOCS_DIR: /app/docs
      DEMO_DB_CONFIRMATION: yes-this-is-the-demo-database
      DEMO_ADMIN_USERNAME: admin
      DEMO_ADMIN_EMAIL: admin@sentry-demo.example
      DEMO_ADMIN_PASSWORD: admin
      DEMO_USER_USERNAME: user
      DEMO_USER_EMAIL: user@sentry-demo.example
      DEMO_USER_PASSWORD: user
    volumes:
      - ./server:/app
      - /app/node_modules
      - sentry_demo_uploads_data:/app/uploads
      - ./docs:/app/docs:ro
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://localhost:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - '5174:5174'
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      VITE_ADMIN_ROUTE_PREFIX: demo-ops
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  sentry_demo_uploads_data:
